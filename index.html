<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Cloud Next Consultant · 180 Flashcards</title>
<style>
:root{--navy:#17243f;--bg:#f7f3ea;--panel:#fffdf8;--line:#ddd7c9;--muted:#6c7482;--green:#2f7355;--red:#a84a4a;--shadow:0 14px 40px rgba(31,38,54,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.top{height:60px;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;z-index:5;font-weight:800}
.top small{font-size:12px;color:var(--muted);font-weight:500}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 60px)}
aside{padding:18px 14px;border-right:1px solid var(--line);background:#fbf8f1}
aside b{display:block;margin:0 0 7px}
select,input{width:100%;padding:10px 11px;margin:5px 0 12px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--navy)}
.secs{display:grid;gap:5px}
.sec{border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:8px;color:#40506b;cursor:pointer}
.sec.active{background:var(--navy);color:#fff}
.main{max-width:1080px;width:100%;margin:auto;padding:24px}
.hero{display:flex;justify-content:space-between;gap:15px;align-items:flex-end}
.hero h1{font:32px Georgia,serif;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:7px}.stat{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:10px;min-width:64px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}
.modes{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.mode,.action,.nav{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;font-weight:800;color:#33415d;cursor:pointer}.mode.on,.primary{background:var(--navy);border-color:var(--navy);color:white}
.progress{height:7px;background:#e5dfd1;border-radius:9px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;background:var(--navy);width:0}
.card{min-height:570px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;cursor:pointer}.back{display:none}.card.flip .front{display:none}.card.flip .back{display:block}
.meta{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:11px}.q{font-size:21px;line-height:1.55;margin:25px 0}.choices{display:grid;gap:9px;margin-top:22px}.choice{display:flex;gap:10px;padding:12px;border:1px solid #d8d3c8;border-radius:9px;background:#fff;line-height:1.45}.choice b,.qchoice b{background:#edf1f5;padding:4px 7px;border-radius:6px;flex:none}
.answer{margin:16px 0;padding:14px;border-radius:10px;background:#eaf5ee;border:1px solid #b9dcc6}.explain{line-height:1.65;font-size:14px}.explain p{margin:0 0 10px}.explain ul{margin:8px 0 12px;padding-left:20px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:12px}.rates{display:flex;gap:7px}.quiz,.perf{display:none}
.quizbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.qchoice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px;border-radius:9px;margin:6px 0;cursor:pointer;line-height:1.45}.qchoice.correct{background:#eaf5ee;border-color:#9fcdb0}.qchoice.wrong{background:#fbecec;border-color:#dfaaaa}.qchoice:disabled{cursor:default}.feedback{margin-top:12px;padding:12px;border-radius:9px;min-height:44px}.feedback.good{background:#eaf5ee}.feedback.bad{background:#fbecec}
.perfgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.pc h3{font-size:13px;margin:0 0 8px}.row{display:flex;justify-content:space-between;font-size:12px}.mini{height:7px;background:#e7e1d4;border-radius:9px;overflow:hidden;margin:7px 0}.mini i{display:block;height:100%;background:var(--navy)}.pc small{color:var(--muted)}code{background:#f0ece3;border-radius:5px;padding:2px 4px}
#loading{text-align:center;color:var(--muted);margin:10px 0;min-height:20px}.empty{display:flex;align-items:center;justify-content:center;min-height:570px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.secs{display:flex;overflow:auto}.sec{white-space:nowrap}.hero{flex-direction:column;align-items:flex-start}.stats{width:100%}.stat{flex:1}.card{min-height:650px}.main{padding:16px}.perfgrid{grid-template-columns:1fr}}
@media(max-width:520px){.card{padding:20px}.controls{flex-wrap:wrap}.rates{width:100%;justify-content:center}}
</style>
</head>
<body>
<header class="top">SF · Marketing Cloud Next Consultant <small>180 Flashcards</small></header>
<div class="layout">
<aside>
  <b>Study Filters</b>
  <select id="level"><option value="all">All Levels · 180</option><option value="1">Easy · 60</option><option value="2">Intermediate · 60</option><option value="3">Advanced · 60</option></select>
  <input id="search" placeholder="Search questions / concepts…">
  <b>Sections</b>
  <div id="sections" class="secs"></div>
</aside>
<main class="main">
  <div class="hero"><div><h1 id="title">Study Mode</h1><p id="subtitle">카드를 클릭해 정답과 해설을 확인하세요.</p></div><div class="stats"><div class="stat"><b id="total">180</b><small>Cards</small></div><div class="stat"><b id="known">0</b><small>Known</small></div><div class="stat"><b id="review">0</b><small>Review</small></div></div></div>
  <div class="modes"><button class="mode on" data-mode="study">Flashcards</button><button class="mode" data-mode="quiz">Quiz Mode</button><button class="mode" data-mode="perf">Performance</button><span style="flex:1"></span><button class="action" id="random">↗ Random</button><button class="action" id="again">↻ Review Again</button><button class="action" id="reset">Reset</button></div>
  <div class="progress"><i id="progress"></i></div><div id="loading"></div>
  <section id="study"><div id="card" class="card"><div class="front"><div class="meta"><span id="num"></span><span id="secLabel"></span></div><div id="question" class="q"></div><div id="choices" class="choices"></div></div><div class="back"><div class="meta"><span>ANSWER & EXPLANATION</span><span id="backLabel"></span></div><div class="answer"><b>Correct Answer</b><div id="answer"></div></div><div id="explanation" class="explain"></div></div></div><div class="controls"><button class="nav" id="prev">← Previous</button><div class="rates"><button class="nav" id="knownBtn">✓ 알고 있음</button><button class="nav" id="reviewBtn">↻ 다시 보기</button></div><button class="nav primary" id="next">Next →</button></div></section>
  <section id="quiz" class="quiz"><div class="quizbox"><div class="meta"><span id="qnum"></span><span id="qsec"></span></div><div id="qq" class="q"></div><div id="qchoices"></div><div id="feedback" class="feedback"></div><div class="controls"><span></span><button class="nav primary" id="qnext">Next →</button></div></div></section>
  <section id="perf" class="perf"><div id="performance" class="perfgrid"></div></section>
</main></div>
<script src="app.js?v=4"></script>
</body></html>
