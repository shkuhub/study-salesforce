<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Cloud Next Consultant — 180 Flashcards</title><style>
:root{--n:#17243f;--c:#f7f3ea;--p:#fffdf8;--l:#ddd7c9;--m:#6c7482;--g:#2f7355;--gb:#eaf5ee;--r:#a84a4a;--rb:#fbecec}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.brand{font-weight:800}.brand small{font-weight:500;color:var(--m)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}aside{padding:18px 14px;border-right:1px solid var(--l);background:#fbf8f1}.filters{display:grid;gap:8px;margin-bottom:18px}select,input{width:100%;padding:10px;border:1px solid var(--l);border-radius:9px;background:white;color:var(--n)}.secs{display:grid;gap:5px}.sec{padding:9px;border:0;border-radius:8px;background:transparent;text-align:left;color:#40506b}.sec.active{background:var(--n);color:white}.main{max-width:1100px;width:100%;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:end}.hero h1{font:32px Georgia,serif;margin:0 0 5px}.hero p{margin:0;color:var(--m);font-size:13px}.stats{display:flex;gap:7px}.stat{background:#fff;border:1px solid var(--l);border-radius:10px;padding:8px 12px}.stat b{font-size:18px;display:block}.stat span{font-size:9px;color:var(--m)}.bar{height:7px;background:#e5dfd1;border-radius:9px;margin:18px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--n);width:0}.modes{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.btn{padding:9px 12px;border:1px solid var(--l);background:#fff;border-radius:8px;font-weight:750;color:#33415d}.btn.on,.primary{background:var(--n);color:white;border-color:var(--n)}.card{min-height:560px;background:var(--p);border:1px solid var(--l);border-radius:18px;box-shadow:0 14px 40px #1f26361a;padding:28px;cursor:pointer}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:11px}.q{font-size:22px;line-height:1.5;margin:25px 0}.choices{display:grid;gap:9px;margin-top:25px}.choice{display:flex;gap:10px;padding:12px;border:1px solid #d8d3c8;background:white;border-radius:9px}.letter{font-weight:900;background:#edf1f5;border-radius:7px;padding:5px 8px}.back{display:none}.card.flip .front{display:none}.card.flip .back{display:block}.answer{background:var(--gb);border:1px solid #b9dcc6;padding:14px;border-radius:10px;margin:16px 0}.exp{line-height:1.65;font-size:14px}.exp p{margin:0 0 10px}.exp ul{padding-left:20px}.controls{display:flex;justify-content:space-between;gap:8px;margin-top:12px;align-items:center}.rates{display:flex;gap:7px}.quiz,.dash{display:none}.quizbox,.dcard{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:24px}.qchoice{width:100%;text-align:left;margin:6px 0;padding:12px;border:1px solid var(--l);background:white;border-radius:9px}.correct{background:var(--gb)!important;border-color:#9fcdb0!important}.wrong{background:var(--rb)!important;border-color:#dfaaaa!important}.feedback{margin-top:12px;padding:12px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dcard h3{margin:0 0 8px;font-size:14px}.empty{text-align:center;color:var(--m);padding:50px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--l)}.secs{display:flex;overflow:auto}.sec{white-space:nowrap}.hero{align-items:flex-start;flex-direction:column}.stats{width:100%}.card{min-height:650px}.main{padding:16px}.grid{grid-template-columns:1fr}}@media(max-width:520px){.top{padding:0 12px}.card{padding:20px}.q{font-size:19px}.controls{flex-wrap:wrap}.rates{width:100%;justify-content:center}}
</style></head><body><header class="top"><div class="brand">SF · Marketing Cloud Next Consultant<br><small>180 Flashcards · Study / Quiz / Performance</small></div></header><div class="layout"><aside><b>Study Filters</b><div class="filters"><select id="level"><option value="all">All Levels · 180</option><option value="1">Easy · 60</option><option value="2">Intermediate · 60</option><option value="3">Advanced · 60</option></select><input id="search" placeholder="Search questions / concepts…"></div><b>Sections</b><div id="secs" class="secs"></div></aside><main class="main"><div class="hero"><div><h1 id="title">Study Mode</h1><p>카드를 뒤집어 정답과 해설을 확인하고 학습 상태를 기록하세요.</p></div><div class="stats"><div class="stat"><b id="tot">180</b><span>Cards</span></div><div class="stat"><b id="known">0</b><span>Known</span></div><div class="stat"><b id="review">0</b><span>Review</span></div></div></div><div class="modes"><button class="btn on" data-mode="study">Flashcards</button><button class="btn" data-mode="quiz">Quiz Mode</button><button class="btn" data-mode="dash">Performance</button><span style="flex:1"></span><button class="btn" id="random">↗ Random</button><button class="btn" id="reviewBtn">↻ Review Again</button><button class="btn" id="reset">Reset</button></div><div class="bar"><i id="prog"></i></div><section id="study"><div id="card" class="card"><div class="front"><div class="meta"><span id="no"></span><span id="section"></span></div><div id="question" class="q"></div><div id="choices" class="choices"></div><div style="text-align:center;color:var(--m);font-size:11px;margin-top:15px">Click / Space to flip</div></div><div class="back"><div class="meta"><span>ANSWER & EXPLANATION</span><span id="blevel"></span></div><div class="answer"><b>Correct Answer</b><div id="answer"></div></div><div id="explanation" class="exp"></div></div></div><div class="controls"><button class="btn" id="prev">← Previous</button><div class="rates"><button class="btn" id="knownBtn">✓ 알고 있음</button><button class="btn" id="reviewCard">↻ 다시 보기</button></div><button class="btn primary" id="next">Next →</button></div></section><section id="quiz" class="quiz"><div class="quizbox"><div class="meta"><span id="qno"></span><span id="qsec"></span></div><div id="qq" class="q"></div><div id="qchoices"></div><div id="feedback" class="feedback"></div><div class="controls"><button class="btn" id="skip">Skip / Next →</button></div></div></section><section id="dash" class="dash"><div class="grid" id="dashboard"></div></section></main></div><script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script src="q5.js"></script><script src="q6.js"></script><script src="q7.js"></script><script src="q8.js"></script><script src="q9.js"></script><script src="q10.js"></script><script src="q11.js"></script><script src="q12.js"></script><script type="module">
const QUESTIONS=[]; for(const b64 of (window.MCN_GZ||[])){const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));QUESTIONS.push(...JSON.parse(await new Response(stream).text()));}
const STORE='mcn180_flashcards_v2', SECTIONS=[['Platform Setup and Governance',1,8],['Consent Management',9,16],['Data Modeling, Identity Resolution, and Segmentation',17,31],['Campaigns, Flows, and Content',32,49],['Agentforce and AI Innovation',50,55],['Analytics and Performance Insights',56,60]];let state=JSON.parse(localStorage.getItem(STORE)||'{"known":{},"review":{},"correct":{},"wrong":{}}'),filtered=QUESTIONS.slice(),idx=0,flip=false,mode='study',quizDone=false,sec='all';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'), md=s=>String(s).split(/\n\s*\n/).map(b=>{let x=b.trim();if(!x)return '';let l=x.split(/\n/);if(l.every(v=>/^\s*-\s+/.test(v)))return '<ul>'+l.map(v=>'<li>'+inline(v.replace(/^\s*-\s+/,''))+'</li>').join('')+'</ul>';return '<p>'+l.map(inline).join('<br>')+'</p>'}).join('');
function save(){localStorage.setItem(STORE,JSON.stringify(state));stats();dash()}function cur(){return filtered[idx]}function stats(){$('tot').textContent=filtered.length;$('known').textContent=Object.values(state.known).filter(Boolean).length;$('review').textContent=Object.values(state.review).filter(Boolean).length}function renderSecs(){ $('secs').innerHTML='<button class="sec '+(sec==='all'?'active':'')+'" data-s="all">All Sections</button>'+SECTIONS.map(s=>'<button class="sec '+(sec===s[0]?'active':'')+'" data-s="'+esc(s[0])+'">'+esc(s[0])+'</button>').join('');document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{sec=b.dataset.s;apply()})}function apply(){let term=$('search').value.trim().toLowerCase(),lv=$('level').value;filtered=QUESTIONS.filter(q=>(lv==='all'||String(q.part)===lv)&&(sec==='all'||q.section===sec)&&(!term||(q.question+' '+q.answerText+' '+q.explanation).toLowerCase().includes(term)));idx=Math.min(idx,Math.max(0,filtered.length-1));renderSecs();render();stats()}function render(){let q=cur();if(!q){$('question').innerHTML='<div class="empty">조건에 맞는 문제가 없습니다.</div>';return}flip=false;$('card').classList.remove('flip');$('no').textContent='Q'+q.id+' · '+q.partName;$('section').textContent=q.section;$('blevel').textContent=q.partName;$('question').innerHTML=md(q.question);$('choices').innerHTML=['A','B','C','D'].map(l=>'<div class="choice"><span class="letter">'+l+'</span><span>'+inline(q.choices[l]||'')+'</span></div>').join('');$('answer').textContent=q.answer+'. '+q.answerText;$('explanation').innerHTML=md(q.explanation);$('prog').style.width=(filtered.length?(idx+1)/filtered.length*100:0)+'%'}function next(){if(filtered.length){idx=(idx+1)%filtered.length;render()}}function prev(){if(filtered.length){idx=(idx-1+filtered.length)%filtered.length;render()}}function mark(t){let id=cur()?.id;if(!id)return;if(t==='known'){state.known[id]=1;delete state.review[id]}else{state.review[id]=1;delete state.known[id]}save();next()}function quiz(){let q=cur();if(!q)return;$('qno').textContent='Q'+q.id+' · '+q.partName;$('qsec').textContent=q.section;$('qq').innerHTML=md(q.question);$('qchoices').innerHTML=['A','B','C','D'].map(l=>'<button class="qchoice" data-l="'+l+'"><b>'+l+'</b> · '+inline(q.choices[l]||'')+'</button>').join('');$('feedback').innerHTML='';$('feedback').className='feedback';quizDone=false;document.querySelectorAll('.qchoice').forEach(b=>b.onclick=()=>answer(b.dataset.l))}function answer(l){if(quizDone)return;quizDone=true;let q=cur(),ok=l===q.answer;document.querySelectorAll('.qchoice').forEach(b=>{if(b.dataset.l===q.answer)b.classList.add('correct');if(b.dataset.l===l&&!ok)b.classList.add('wrong');b.disabled=true});(ok?state.correct:state.wrong)[q.id]=1;save();$('feedback').className='feedback '+(ok?'answer':'');$('feedback').innerHTML=ok?'✓ Correct<br>'+esc(q.answerText):'✕ Incorrect<br>정답: '+esc(q.answer+'. '+q.answerText)+'<div style="margin-top:8px">'+md(q.explanation)+'</div>'}function dash(){ $('dashboard').innerHTML=SECTIONS.map(s=>{let qs=QUESTIONS.filter(q=>q.section===s[0]),k=qs.filter(q=>state.known[q.id]).length,r=qs.filter(q=>state.review[q.id]).length,c=qs.filter(q=>state.correct[q.id]).length,w=qs.filter(q=>state.wrong[q.id]).length,p=qs.length?Math.round(k/qs.length*100):0;return '<div class="dcard"><h3>'+esc(s[0])+'</h3><b>Known '+k+'/'+qs.length+' · '+p+'%</b><div class="bar"><i style="width:'+p+'%"></i></div><small>Review '+r+' · Quiz ✓ '+c+' · Quiz ✕ '+w+'</small></div>'}).join('')}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('study').style.display=m==='study'?'block':'none';$('quiz').style.display=m==='quiz'?'block':'none';$('dash').style.display=m==='dash'?'block':'none';$('title').textContent=m==='study'?'Study Mode':m==='quiz'?'Quiz Mode':'Performance';if(m==='quiz')quiz();if(m==='dash')dash()}$('card').onclick=()=>{$('card').classList.toggle('flip')};$('next').onclick=next;$('prev').onclick=prev;$('knownBtn').onclick=()=>mark('known');$('reviewCard').onclick=()=>mark('review');$('random').onclick=()=>{idx=Math.floor(Math.random()*filtered.length);render()};$('reviewBtn').onclick=()=>{filtered=QUESTIONS.filter(q=>state.review[q.id]);idx=0;render()};$('reset').onclick=()=>{if(confirm('모든 학습 기록을 초기화할까요?')){state={known:{},review:{},correct:{},wrong:{}};save();render()}};$('skip').onclick=next;$('level').onchange=()=>{idx=0;apply()};$('search').oninput=()=>{idx=0;apply()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button'))return;if(mode==='study'){if(e.code==='Space'){e.preventDefault();$('card').classList.toggle('flip')}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()}else if(mode==='quiz'){if('1234'.includes(e.key))answer(['A','B','C','D'][+e.key-1]);if(e.key==='ArrowRight')next()}});renderSecs();render();stats();dash();
</script></body></html>
