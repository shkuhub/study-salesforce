<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SF · Marketing Cloud Next Consultant</title>
<style>
:root{--navy:#17243f;--bg:#f7f3ea;--panel:#fffdf8;--white:#fff;--line:#ddd7c9;--muted:#6b7380;--green:#2f7355;--green-bg:#eaf5ee;--red:#a84a4a;--red-bg:#fbecec;--shadow:0 14px 36px rgba(23,36,63,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;font-weight:800}.topbar .sub{margin-left:7px;color:var(--muted);font-size:12px;font-weight:500}
.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 48px)}.sidebar{background:#fbf8f1;border-right:1px solid var(--line);padding:16px 10px}.sidebar-title{font-size:13px;font-weight:800;margin:0 0 8px}.level-tabs{display:grid;gap:6px;margin-bottom:18px}.level-tab{border:1px solid var(--line);background:var(--white);border-radius:9px;text-align:left;padding:10px 11px;font-weight:800;color:#3a4861}.level-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.sidebar input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:18px}.sections{display:grid;gap:4px}.section-btn{border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:8px;color:#4b5870;font-size:12px}.section-btn.active{background:var(--navy);color:#fff}
.main{max-width:1120px;width:100%;margin:0 auto;padding:22px 28px 32px}.header-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.heading h1{font:32px Georgia,serif;margin:0 0 3px}.heading p{margin:0;color:var(--muted);font-size:12px}.stats{display:flex;gap:7px}.stat{min-width:65px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;text-align:center}.stat b{font-size:18px;display:block}.stat span{font-size:10px;color:var(--muted)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}.mode,.action,.nav{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;font-weight:800;color:#33415d}.mode.active,.nav.primary{background:var(--navy);border-color:var(--navy);color:#fff}.spacer{flex:1}.progress{height:7px;background:#e6dfd2;border-radius:9px;overflow:hidden;margin-bottom:8px}.progress i{display:block;height:100%;background:var(--navy);width:0}.status{height:18px;text-align:center;color:var(--muted);font-size:11px}
.card{min-height:590px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;position:relative}.card-front,.card-back{min-height:530px}.card-back{display:none}.card.flipped .card-front{display:none}.card.flipped .card-back{display:block}.meta{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:10px}.question{font-size:20px;line-height:1.58;margin:25px 0}.choice-list{display:grid;gap:9px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #d9d4ca;background:#fff;border-radius:9px;padding:11px 12px;line-height:1.45}.choice b{flex:none;background:#edf1f5;border-radius:6px;padding:3px 7px}.hint{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}.answer-box{background:var(--green-bg);border:1px solid #b9dcc6;border-radius:10px;padding:13px 14px;margin:18px 0 12px}.answer-box strong{display:block;margin-bottom:5px}.explanation{font-size:13px;line-height:1.65}.explanation p{margin:0 0 11px}.explanation ul{margin:7px 0 12px;padding-left:20px}.explanation code,.exam-card code{background:#f0ece3;padding:2px 4px;border-radius:5px}
.bottom-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.center-controls{display:flex;gap:7px}.exam,.performance{display:none}.exam-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px;min-height:590px}.exam-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.exam-options{display:grid;gap:9px;margin-top:22px}.exam-option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px;line-height:1.45}.exam-option.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(23,36,63,.10)}.exam-nav{display:flex;justify-content:space-between;margin-top:16px}
.result{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px}.result-score{font:42px Georgia,serif;margin:4px 0 6px}.result-note{color:var(--muted);font-size:12px;margin-bottom:20px}.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.section-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.section-card h3{font-size:13px;margin:0 0 8px}.row{display:flex;justify-content:space-between;font-size:12px}.bar{height:7px;background:#e7e1d4;border-radius:7px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--navy)}.small-btn{padding:7px 10px;font-size:11px}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.level-tabs{display:flex;overflow:auto}.level-tab{white-space:nowrap}.sections{display:flex;overflow:auto}.section-btn{white-space:nowrap}.main{padding:18px 14px 26px}.header-row{flex-direction:column;align-items:flex-start}.stats{width:100%}.stat{flex:1}.section-grid{grid-template-columns:1fr}}
@media(max-width:560px){.card,.exam-card,.result{padding:20px}.card,.exam-card{min-height:620px}.card-front,.card-back{min-height:560px}.question{font-size:18px}.bottom-controls{flex-wrap:wrap}.center-controls{width:100%;justify-content:center;order:2}}
</style>
</head>
<body>
<header class="topbar">SF · Marketing Cloud Next Consultant <span class="sub">180 Flashcards</span></header>
<div class="app">
<aside class="sidebar"><div class="sidebar-title">Difficulty</div><div class="level-tabs" id="levels"></div><input id="search" placeholder="Search questions / concepts…"><div class="sidebar-title">Sections</div><div class="sections" id="sections"></div></aside>
<main class="main"><div class="header-row"><div class="heading"><h1 id="pageTitle">Easy</h1><p id="pageSubtitle">60 questions · Study Mode</p></div><div class="stats"><div class="stat"><b id="cardCount">60</b><span>Cards</span></div><div class="stat"><b id="known">0</b><span>Known</span></div><div class="stat"><b id="review">0</b><span>Review</span></div></div></div>
<div class="toolbar"><button class="mode active" data-mode="study">Study Mode</button><button class="mode" data-mode="exam">Exam Mode</button><button class="mode" data-mode="performance">Performance</button><span class="spacer"></span><button class="action" id="random">↗ Random</button><button class="action" id="again">↻ Review Again</button><button class="action" id="reset">Reset</button></div>
<div class="progress"><i id="progress"></i></div><div id="status" class="status"></div>
<section id="study"><div id="studyCard" class="card"><div class="card-front"><div class="meta"><span id="qmeta"></span><span id="qsection"></span></div><div id="question" class="question"></div><div id="choices" class="choice-list"></div><div class="hint">카드를 클릭하면 정답과 해설을 확인합니다.</div></div><div class="card-back"><div class="meta"><span>ANSWER & EXPLANATION</span><span id="backMeta"></span></div><div class="answer-box"><strong>Correct Answer</strong><div id="answer"></div></div><div id="explanation" class="explanation"></div></div></div><div class="bottom-controls"><button class="nav" id="prev">← Previous</button><div class="center-controls"><button class="nav" id="knownBtn">✓ 알고 있음</button><button class="nav" id="reviewBtn">↻ 다시 보기</button></div><button class="nav primary" id="next">Next →</button></div></section>
<section id="exam" class="exam"><div id="examRoot"></div></section><section id="performance" class="performance"><div id="performanceRoot"></div></section>
</main></div>
<script>
const QUESTIONS = __DATA__;
const SECTIONS=["Platform Setup and Governance","Consent Management","Data Modeling, Identity Resolution, and Segmentation","Campaigns, Flows, and Content","Agentforce and AI Innovation","Analytics and Performance Insights"];
const LEVELS=[{part:1,name:"Easy",count:60},{part:2,name:"Intermediate",count:60},{part:3,name:"Advanced",count:60}];
const STORE_KEY="mcn-consultant-v8";const $=id=>document.getElementById(id);let level=1,mode="study",section="all",filtered=[],index=0,flipped=false;
let state;try{state=JSON.parse(localStorage.getItem(STORE_KEY)||"")}catch(e){}if(!state||typeof state!=="object")state={known:{},review:{},exam:{}};
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function inline(t){return escapeHTML(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}function formatText(t){return String(t??"").split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return"";let ls=b.split("\n").filter(Boolean);if(ls.every(x=>/^\s*-\s+/.test(x)))return"<ul>"+ls.map(x=>"<li>"+inline(x.replace(/^\s*-\s+/,""))+"</li>").join("")+"</ul>";return"<p>"+ls.map(inline).join("<br>")+"</p>"}).join("")}
function currentQuestions(){const t=$("search").value.trim().toLowerCase();return QUESTIONS.filter(q=>q.part===level&&(section==="all"||q.section===section)&&(!t||[q.question,q.answerText,q.explanation,q.section].join(" ").toLowerCase().includes(t)))}
function renderLevels(){ $("levels").innerHTML=LEVELS.map(x=>`<button class="level-tab ${level===x.part?"active":""}" data-level="${x.part}">${x.name} · 60</button>`).join("");document.querySelectorAll(".level-tab").forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);section="all";index=0;renderLevels();renderSections();if(mode==="exam")startExam();refresh()}) }
function renderSections(){ $("sections").innerHTML=`<button class="section-btn active" data-section="all">All Sections</button>`+SECTIONS.map(s=>`<button class="section-btn" data-section="${escapeHTML(s)}">${escapeHTML(s)}</button>`).join("");document.querySelectorAll(".section-btn").forEach(b=>b.onclick=()=>{section=b.dataset.section;index=0;document.querySelectorAll(".section-btn").forEach(x=>x.classList.toggle("active",x===b));refresh()}) }
function refresh(){filtered=currentQuestions();if(index>=filtered.length)index=Math.max(0,filtered.length-1);$("pageTitle").textContent=LEVELS[level-1].name;$("pageSubtitle").textContent=`${filtered.length} questions · ${mode==="study"?"Study Mode":mode==="exam"?"Exam Mode":"Performance"}`;$("cardCount").textContent=filtered.length;$("known").textContent=Object.values(state.known).filter(Boolean).length;$("review").textContent=Object.values(state.review).filter(Boolean).length;if(mode==="study")renderStudy();else if(mode==="exam")renderExam();else renderPerformance();$("progress").style.width=(filtered.length?(index+1)/filtered.length*100:0)+"%"}
function renderStudy(){ $("study").style.display="block";$("exam").style.display="none";$("performance").style.display="none";const q=filtered[index];if(!q){$("question").innerHTML="";$("choices").innerHTML="";$("answer").textContent="";$("explanation").innerHTML="";$("status").textContent="조건에 맞는 문항이 없습니다.";return}$("status").textContent="";flipped=false;$("studyCard").classList.remove("flipped");$("qmeta").textContent=`Q${q.no} · ${q.partName}`;$("qsection").textContent=q.section;$("backMeta").textContent=q.partName;$("question").innerHTML=formatText(q.question);$("choices").innerHTML=["A","B","C","D"].map(l=>`<div class="choice"><b>${l}</b><span>${inline(q.choices[l]||"")}</span></div>`).join("");$("answer").textContent=`${q.answer}. ${q.answerText}`;$("explanation").innerHTML=formatText(q.explanation)}
function next(){if(filtered.length){index=(index+1)%filtered.length;renderStudy();$("progress").style.width=(index+1)/filtered.length*100+"%"}}function prev(){if(filtered.length){index=(index-1+filtered.length)%filtered.length;renderStudy();$("progress").style.width=(index+1)/filtered.length*100+"%"}}
function mark(type){if(!filtered.length)return;const q=filtered[index];if(type==="known"){state.known[q.id]=1;delete state.review[q.id]}else{state.review[q.id]=1;delete state.known[q.id]}save();next();refresh()}
$("studyCard").onclick=()=>{if(filtered.length){flipped=!flipped;$("studyCard").classList.toggle("flipped",flipped)}};$("next").onclick=next;$("prev").onclick=prev;$("knownBtn").onclick=()=>mark("known");$("reviewBtn").onclick=()=>mark("review");$("random").onclick=()=>{if(filtered.length){index=Math.floor(Math.random()*filtered.length);refresh()}};$("again").onclick=()=>{filtered=QUESTIONS.filter(q=>q.part===level&&state.review[q.id]);index=0;mode="study";document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode==="study"));renderStudy();$("cardCount").textContent=filtered.length;$("status").textContent=filtered.length?`${filtered.length}개 Review 문항`:"Review 문항이 없습니다."};$("reset").onclick=()=>{if(confirm("모든 학습 기록을 초기화할까요?")){state={known:{},review:{},exam:{}};save();refresh()}};$("search").oninput=()=>{index=0;refresh()};
let examQuestions=[],examIndex=0,examAnswers={},examFinished=false;function startExam(){examQuestions=QUESTIONS.filter(q=>q.part===level);examIndex=0;examAnswers={};examFinished=false;$("status").textContent="60 questions · 105 minutes"}
function renderExam(){$("study").style.display="none";$("exam").style.display="block";$("performance").style.display="none";if(examFinished){renderExamResult();return}const q=examQuestions[examIndex];const selected=examAnswers[q.id]||"";$("examRoot").innerHTML=`<div class="exam-card"><div class="exam-head"><span>Q${q.no} / ${examQuestions.length} · ${escapeHTML(q.partName)}</span><span>${escapeHTML(q.section)}</span></div><div class="question">${formatText(q.question)}</div><div class="exam-options">${["A","B","C","D"].map(l=>`<button class="exam-option ${selected===l?"selected":""}" data-answer="${l}"><b>${l}</b> · ${inline(q.choices[l]||"")}</button>`).join("")}</div><div class="exam-nav"><button class="nav" id="examPrev" ${examIndex===0?"disabled":""}>← Previous</button>${examIndex===examQuestions.length-1?`<button class="nav primary" id="finishExam">Finish Exam</button>`:`<button class="nav primary" id="examNext">Next →</button>`}</div></div>`;document.querySelectorAll(".exam-option").forEach(b=>b.onclick=()=>{examAnswers[q.id]=b.dataset.answer;renderExam()});if($("examPrev"))$("examPrev").onclick=()=>{if(examIndex>0){examIndex--;renderExam()}};if($("examNext"))$("examNext").onclick=()=>{if(examIndex<examQuestions.length-1){examIndex++;renderExam()}};if($("finishExam"))$("finishExam").onclick=finishExam}
function finishExam(){let score=0,sectionScores={};SECTIONS.forEach(s=>sectionScores[s]={correct:0,total:0});examQuestions.forEach(q=>{const ok=examAnswers[q.id]===q.answer;if(ok)score++;sectionScores[q.section].total++;if(ok)sectionScores[q.section].correct++;state.exam[q.id]=ok?"correct":"wrong"});save();localStorage.setItem("mcn-last-exam",JSON.stringify({level,score,sectionScores,at:Date.now()}));examFinished=true;renderExamResult()}
function renderExamResult(){const r=JSON.parse(localStorage.getItem("mcn-last-exam")||"{}");const score=r.score||0;$("examRoot").innerHTML=`<div class="result"><div class="meta"><span>${escapeHTML(LEVELS[(r.level||level)-1].name)} · Exam Result</span><span>60 questions</span></div><div class="result-score">${score} / 60</div><div class="result-note">${Math.round(score/60*100)}% · 답안 제출 완료</div><button class="nav primary small-btn" id="retake">Take Again</button> <button class="nav small-btn" id="reviewWrong">Review Wrong Answers</button><h3 style="margin:24px 0 10px;font-size:15px">Performance by section</h3><div class="section-grid">${SECTIONS.map(s=>{const x=(r.sectionScores||{})[s]||{correct:0,total:0};const p=x.total?Math.round(x.correct/x.total*100):0;return `<div class="section-card"><h3>${escapeHTML(s)}</h3><div class="row"><b>${x.correct}/${x.total}</b><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div></div>`;$("retake").onclick=()=>{startExam();renderExam()};$("reviewWrong").onclick=()=>{filtered=examQuestions.filter(q=>state.exam[q.id]==="wrong");index=0;mode="study";document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode==="study"));renderStudy();updateProgress()}}
function updateProgress(){$("progress").style.width=(filtered.length?(index+1)/filtered.length*100:0)+"%"}
function renderPerformance(){$("study").style.display="none";$("exam").style.display="none";$("performance").style.display="block";const qs=QUESTIONS.filter(q=>q.part===level);$("performanceRoot").innerHTML=`<div class="result"><div class="meta"><span>${LEVELS[level-1].name} · Performance</span><span>60 questions</span></div><h3 style="margin:8px 0 14px;font-size:18px">Performance by section</h3><div class="section-grid">${SECTIONS.map(s=>{const a=qs.filter(q=>q.section===s),k=a.filter(q=>state.known[q.id]).length,r=a.filter(q=>state.review[q.id]).length,c=a.filter(q=>state.exam[q.id]==="correct").length,w=a.filter(q=>state.exam[q.id]==="wrong").length,p=a.length?Math.round(k/a.length*100):0;return `<div class="section-card"><h3>${escapeHTML(s)}</h3><div class="row"><b>${k}/${a.length} Known</b><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div><small style="color:var(--muted)">Review ${r} · Exam ✓ ${c} · Exam ✕ ${w}</small></div>`}).join("")}</div></div>`}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));if(mode==="exam")startExam();refresh()});init=null;renderLevels();renderSections();refresh();
</script>
</body>
</html>
